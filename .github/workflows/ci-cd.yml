name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: chillwhispers_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: chillwhispers_testing
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, xml, zip, ctype, tokenizer
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create .env
        run: |
          cp .env.example .env
          # alaouy/youtube throws at construction time if this is empty, even though
          # every test that touches it mocks the Youtube facade before any real call.
          sed -i 's/^YOUTUBE_API_KEY=.*/YOUTUBE_API_KEY=test-key-not-real-mocked-in-tests/' .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run feature test suite
        run: vendor/bin/phpunit --testsuite=Feature --exclude-group broken

  # Manual-trigger only: shared cPanel/FTP hosting has no real remote command execution,
  # so this is a semi-manual step by nature (needs the secrets below configured first).
  # Tests on every push/PR are the actual safety net - this just uploads on demand.
  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: chillapi2

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, xml, zip, ctype, tokenizer
          coverage: none

      - name: Install production dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Write production .env
        run: |
          cat > .env << EOF
          APP_NAME=ChillWhispers
          APP_ENV=production
          APP_KEY=${{ secrets.CHILLAPI2_APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://chillapi2.levelcoding.com

          LOG_CHANNEL=stack

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.PROD_DB_HOST }}
          DB_PORT=${{ secrets.PROD_DB_PORT }}
          DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}
          DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}

          BROADCAST_DRIVER=log
          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          EOF

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /chillapi2.levelcoding.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/.phpunit.cache/**
            **/node_modules/**
            **/storage/logs/**
