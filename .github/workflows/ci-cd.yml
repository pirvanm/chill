name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: chillwhispers_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: chillwhispers_testing
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, xml, zip, ctype, tokenizer
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create .env
        run: |
          cp .env.example .env
          # alaouy/youtube throws at construction time if this is empty, even though
          # every test that touches it mocks the Youtube facade before any real call.
          sed -i 's/^YOUTUBE_API_KEY=.*/YOUTUBE_API_KEY=test-key-not-real-mocked-in-tests/' .env

      - name: Generate app key
        run: php artisan key:generate --ansi

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run feature test suite
        run: vendor/bin/phpunit --testsuite=Feature --exclude-group broken

  # Manual-trigger only: shared cPanel/FTP hosting has no real remote command execution,
  # so this is a semi-manual step by nature (needs the secrets below configured first).
  # Tests on every push/PR are the actual safety net - this just uploads on demand.
  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: chillapi2

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, bcmath, curl, xml, zip, ctype, tokenizer
          coverage: none

      - name: Install production dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      - name: Write chillapi2 .env
        run: |
          cat > .env << EOF
          APP_NAME=ChillWhispers
          APP_ENV=staging
          APP_KEY=${{ secrets.CHILLAPI2_APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://chillapi2.levelcoding.com

          LOG_CHANNEL=stack

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.CHILLAPI2_DB_HOST }}
          DB_PORT=${{ secrets.CHILLAPI2_DB_PORT }}
          DB_DATABASE=${{ secrets.CHILLAPI2_DB_DATABASE }}
          DB_USERNAME=${{ secrets.CHILLAPI2_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.CHILLAPI2_DB_PASSWORD }}

          BROADCAST_DRIVER=log
          CACHE_DRIVER=file
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          EOF

      # Plain FTP has no bulk transfer - uploading ~16,000 individual vendor/ files one
      # at a time took over an hour on shared hosting and never finished. Instead: zip
      # the whole app into one file, upload just that (one transfer), then trigger a
      # one-off PHP script (deploy/unpack.template.php) over HTTP to unzip it
      # server-side and delete itself. A few round-trips instead of thousands.
      - name: Build deploy archive
        id: build
        run: |
          mkdir -p /tmp/payload_root /tmp/payload_public
          zip -r -q /tmp/payload_root/deploy.zip . \
            -x ".git/*" -x ".github/*" -x ".history/*" -x ".idea/*" \
            -x "tests/*" -x ".phpunit.cache/*" -x "node_modules/*" -x "storage/logs/*" \
            -x "deploy/*"

          TOKEN=$(openssl rand -hex 16)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "script_name=_unpack_${TOKEN}.php" >> "$GITHUB_OUTPUT"

          sed "s/__TOKEN__/${TOKEN}/" deploy/unpack.template.php > "/tmp/payload_public/_unpack_${TOKEN}.php"
          php -l "/tmp/payload_public/_unpack_${TOKEN}.php"

      - name: Upload archive to project root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/payload_root/
          server-dir: /chillapi2.levelcoding.com/
          state-name: .ftp-deploy-sync-state-root.json

      - name: Upload unpack script to public/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: /tmp/payload_public/
          server-dir: /chillapi2.levelcoding.com/public/
          state-name: .ftp-deploy-sync-state-public.json

      - name: Trigger unpack and verify it ran
        run: |
          RESPONSE=$(curl -sf "https://chillapi2.levelcoding.com/${{ steps.build.outputs.script_name }}?token=${{ steps.build.outputs.token }}")
          echo "Unpack response: $RESPONSE"
          if [ "$RESPONSE" != "OK" ]; then
            echo "::error::Unpack script did not report OK"
            exit 1
          fi
          # Confirm the script actually deleted itself (proof it ran, not just that
          # curl got a 200 - a leftover script would be a real exposure).
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://chillapi2.levelcoding.com/${{ steps.build.outputs.script_name }}")
          if [ "$STATUS" != "404" ]; then
            echo "::error::Unpack script is still reachable after running (expected 404, got $STATUS)"
            exit 1
          fi
